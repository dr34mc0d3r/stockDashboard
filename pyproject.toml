[project]
name = "stockDashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alpaca-py>=0.43.4",
    "certifi>=2024.2.2",
    "fastapi>=0.136.3",
    "finnhub-python>=2.4.28",
    "numpy<2",
    "pandas>=3.0.3",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "torch==2.2.2",
    "uvicorn[standard]>=0.48.0",
    "websocket-client>=1.9.0",
    "yfinance>=1.4.1",
]

[tool.pyright]
# Reference/example snippets under docs/ are not part of the codebase.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "docs",
]

[tool.pytest.ini_options]
# Source lives under src/; src/backend on the path lets tests import the app
# the same way uvicorn runs it (bare `from main import app`).
pythonpath = ["src", "src/backend"]
testpaths = ["src/backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/backend"]
# Only the active codebase — srcV1/ and docs/ are legacy/reference snippets.
include = ["src/backend/**/*.py"]

[tool.ruff.lint]
# Beginner-friendly, high-value rule families only:
# E/W pycodestyle, F pyflakes, I import sorting, UP modern syntax, B common bugs.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines: the formatter handles wrapping; don't double-flag

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.6",
]
